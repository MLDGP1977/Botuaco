<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        :root {
            --bg: #f3f2f1;
            --card: #ffffff;
            --borda: #e1dfdd;
            --texto: #252423;
            --cinza: #605e5c;
            --azul: #0078d4;
            --azul2: #106ebe;
            --verde: #107c10;
            --vermelho: #d13438;
            --amarelo: #d97706;
            --roxo: #8764b8;
            --cinza2: #faf9f8;
            --sombra: 0 1.6px 3.6px rgba(0, 0, 0, .13), 0 0.3px 0.9px rgba(0, 0, 0, .1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--texto)
        }

        #login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2a4a 0%, #1c4a7a 100%);
            padding: 20px;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        .login-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            height: 64px;
            width: auto;
            margin-bottom: 16px;
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f2a4a;
            margin: 0 0 6px 0;
        }

        .login-header p {
            font-size: 14px;
            color: #7a8aa0;
            margin: 0;
        }

        .profile-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 18px;
            border: 1.5px solid #e3e8ef;
            border-radius: 14px;
            background: #fafbfc;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .profile-card:hover {
            border-color: #f28c28;
            background: #fff7ee;
            box-shadow: 0 6px 18px rgba(242, 140, 40, 0.15);
            transform: translateY(-2px);
        }

        .profile-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 12px;
            background: #0f2a4a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-icon svg {
            width: 26px;
            height: 26px;
        }

        .profile-card:nth-child(2) .profile-icon {
            background: #f28c28;
        }

        .profile-text {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .profile-text strong {
            font-size: 15px;
            color: #0f2a4a;
            margin-bottom: 3px;
        }

        .profile-text span {
            font-size: 13px;
            color: #7a8aa0;
        }

        .profile-arrow {
            color: #b6c2d1;
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .profile-card:hover .profile-arrow {
            transform: translateX(4px);
            color: #f28c28;
        }

        /* =========================================================
   RANKING DE DESEMPENHO DOS MOTORISTAS
========================================================= */

.motorista-ranking-card {
    overflow: hidden;
}


/* PODIO */

.podio-motoristas {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    align-items: end;
    margin-top: 18px;
}


.podio-item {
    text-align: center;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px 10px;
    background: #fff;
    transition: transform .2s ease, box-shadow .2s ease;
}


.podio-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
}


/* PRIMEIRO LUGAR */

.podio-1 {
    order: 2;
    padding-top: 22px;
}


/* SEGUNDO */

.podio-2 {
    order: 1;
}


/* TERCEIRO */

.podio-3 {
    order: 3;
}


.podio-medalha {
    font-size: 28px;
    margin-bottom: 8px;
}


.podio-foto,
.podio-sem-foto {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 8px;
}


.podio-sem-foto {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: #f3f4f6;
}


.podio-nome {
    font-weight: 800;
    font-size: 13px;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


.podio-custo-km {
    margin-top: 7px;
    font-size: 17px;
    font-weight: 900;
    color: #16a34a;
}


.podio-contexto {
    margin-top: 3px;
    font-size: 10px;
    color: var(--cinza);
}


/* PONTO DE ATENÇÃO */

.ponto-atencao-motorista {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #e5e7eb;

    display: flex;
    align-items: center;
    gap: 10px;
}


.atencao-icone {
    font-size: 22px;
}


.atencao-foto,
.atencao-sem-foto {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
}


.atencao-sem-foto {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    font-size: 20px;
}


.atencao-info {
    flex: 1;
    min-width: 0;
}


.atencao-label {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .7px;
    color: #dc2626;
}


.atencao-nome {
    margin-top: 2px;
    font-size: 13px;
    font-weight: 800;
    color: #111827;
}


.atencao-contexto {
    margin-top: 3px;
    font-size: 10px;
    color: var(--cinza);
}


.atencao-indicador {
    text-align: right;
}


.atencao-valor {
    font-size: 16px;
    font-weight: 900;
    color: #dc2626;
}


.atencao-sub {
    margin-top: 2px;
    font-size: 9px;
    color: var(--cinza);
}


/* MOBILE */

@media (max-width: 600px) {

    .podio-motoristas {
        gap: 6px;
    }

    .podio-item {
        padding: 10px 5px;
    }

    .podio-foto,
    .podio-sem-foto {
        width: 46px;
        height: 46px;
    }

    .podio-medalha {
        font-size: 22px;
    }

    .podio-nome {
        font-size: 11px;
    }

    .podio-custo-km {
        font-size: 14px;
    }

    .podio-contexto {
        font-size: 8px;
    }

    .ponto-atencao-motorista {
        gap: 7px;
    }

    .atencao-contexto {
        font-size: 9px;
    }

    .atencao-valor {
        font-size: 13px;
    }

}

        const TABELAS = ['VEICULOS', 'MOTORISTAS', 'VIAGENS', 'ABASTECIMENTOS', 'MANUTENCOES'];
        const DB = {
            get(k) { try { return JSON.parse(localStorage.getItem('frota_' + k)) || [] } catch (e) { return [] } },
            set(k, v) { localStorage.setItem('frota_' + k, JSON.stringify(v)) }
        };
        let veiculos = DB.get('veiculos');
        let motoristas = DB.get('motoristas');

        async function apiGet(tabela) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
                const r = await fetch(API_URL + '?tabela=' + encodeURIComponent(tabela), { signal: controller.signal });
                const j = await r.json();
                return (j && j.ok) ? j.dados : [];
            } catch (e) {
                if (e && e.name === 'AbortError') {
                    console.warn('API GET expirou:', tabela);
                } else {
                    console.warn('API GET falhou:', tabela, e);
                }
                return null;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function apiPost(tabela, dados, acao) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
                const r = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ tabela, acao, dados }),
                    signal: controller.signal
                });
                const j = await r.json();
                return (j && j.ok);
            } catch (e) {
                if (e && e.name === 'AbortError') {
                    console.warn('API POST expirou:', tabela, acao);
                } else {
                    console.warn('API POST falhou:', tabela, acao, e);
                }
                return false;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function sincronizar() {
            const label = document.getElementById('syncLabel');

            const promessas = TABELAS.map(async t => {
                const dados = await apiGet(t);
                if (dados === null) return false;
                if (t === 'VEICULOS') veiculos = dados;
                else if (t === 'MOTORISTAS') motoristas = dados;
                else if (t === 'VIAGENS') viagens = dados;
                else if (t === 'ABASTECIMENTOS') abastecimentos = dados;
                else if (t === 'MANUTENCOES') manutencoes = dados;
                return true;
            });
            const res = await Promise.all(promessas);
            syncOnline = res.every(Boolean);

                };
                document.addEventListener('focusout', renderPendente, true);
                return;

            render();

    if (senha) senha.value = '';

    if (sel) {
        sel.innerHTML = '<option value="">Carregando motoristas...</option>';
        sel.disabled = true;
    }
    if (btn) btn.disabled = true;

    try {
        // Sempre tenta buscar a versão mais recente dos motoristas antes do login.
        const dados = await apiGet('MOTORISTAS');
        if (token !== loginValidacaoToken) return;
        if (Array.isArray(dados)) motoristas = dados;
    } catch (e) {
        console.warn('Não foi possível atualizar os motoristas para o login:', e);
    }

    if (token !== loginValidacaoToken) return;

    const ativos = motoristas.filter(m => (m.status || 'Ativo') === 'Ativo');
    if (sel) {
        sel.innerHTML = ativos.map(m => `<option value="${m.id}">${m.nome}</option>`).join('') || '<option value="">Nenhum motorista ativo cadastrado</option>';
        sel.disabled = false;
    }
    if (btn) btn.disabled = false;
}

async function validarMotorista() {
    const token = ++loginValidacaoToken;
    const sel = document.getElementById('lmMot');
    const campo = document.getElementById('lmSenha');
    const btn = document.querySelector('#loginMotorista .btn.green');
    const id = sel ? sel.value : '';
    const senha = campo ? campo.value.trim() : '';

    if (!id) { toast('⚠️ Selecione um motorista'); return; }
    if (!senha) { toast('⚠️ Digite a senha'); if (campo) campo.focus(); return; }

    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Verificando...';
    }

    try {
        // Atualiza novamente no momento exato da validação para evitar senha antiga em cache/localStorage.
        const dados = await apiGet('MOTORISTAS');
        if (token !== loginValidacaoToken) return;
        if (Array.isArray(dados) && dados.length) motoristas = dados;

        const m = motoristas.find(x => String(x.id) === String(id));
        if (!m) {
            toast('⚠️ Motorista não encontrado ou foi atualizado. Abra o acesso novamente.');
            return;
        }
        if ((m.status || 'Ativo') !== 'Ativo') {
            toast('⚠️ Este motorista está inativo');
            return;
        }

        const senhaCadastro = String(m.senha ?? '').trim();
        if (!senhaCadastro || senhaCadastro !== senha) {
            toast('🔒 Senha incorreta');
            if (campo) { campo.select(); campo.focus(); }
            return;
        }

        motoristaAtual = m;
        if (campo) campo.value = '';
        entrar('motorista');
    } catch (erro) {
        console.error('Erro ao validar motorista:', erro);
        toast('❌ Não foi possível validar o motorista. Tente novamente.');
    } finally {
        if (token === loginValidacaoToken && btn) {
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    }
}

async function validarAdmin() {
    const token = ++loginValidacaoToken;
    const campo = document.getElementById('adminSenha');
    const senha = campo ? campo.value.trim() : '';

    if (!senha) {
        toast('⚠️ Digite a senha');
        if (campo) campo.focus();
        return;
    }

    const btn = document.querySelector('#loginAdmin .btn.green');
    if (btn) {

        btn.textContent = 'Verificando...';
    }

function nomeVeiculo(id) { const v = veiculos.find(x => x.id === id); return v ? v.placa + ' · ' + v.modelo : '—'; }
        function nomeMotorista(id) { const m = motoristas.find(x => x.id === id); return m ? m.nome : '—'; }
        function kmVeiculo(id) { return viagens.filter(v => v.vehicleId === id).reduce((s, v) => s + ((+v.kmFinal || 0) - (+v.kmInicial || 0)), 0); }
        function custoCombustivel(id) { return abastecimentos.filter(a => !id || a.vehicleId === id).reduce((s, a) => s + (+a.valor || 0), 0); }
        function custoManutencao(id) { return manutencoes.filter(m => !id || m.vehicleId === id).reduce((s, m) => s + (+m.custo || 0), 0); }
        function litrosTotais(id) { return abastecimentos.filter(a => !id || a.vehicleId === id).reduce((s, a) => s + (+a.litros || 0), 0); }
        function kmTotal(id) { return viagens.filter(v => !id || v.vehicleId === id).reduce((s, v) => s + ((+v.kmFinal || 0) - (+v.kmInicial || 0)), 0); }
        function consumoMedio(id) { const l = litrosTotais(id), km = kmTotal(id); return l > 0 ? km / l : 0; }
        function custoPedagio(id) { return (abastecimentos || []).filter(a => !id || String(a.vehicleId) === String(id)).reduce((s, a) => s + (+a.pedagio || 0), 0); }
        function custoDespesaExtra(id) { return (abastecimentos || []).filter(a => !id || String(a.vehicleId) === String(id)).reduce((s, a) => s + (+a.despesaExtra || 0), 0); }
        function custoPedagioMaisExtras(id) { return custoPedagio(id) + custoDespesaExtra(id); }
        function custoPorKm(id) { const km = kmTotal(id); const custo = custoCombustivel(id) + custoManutencao(id) + custoPedagioMaisExtras(id); return km > 0 ? custo / km : 0;}
        function custoManutencaoMotorista(mid) { return manutencoes.filter(m => m.driverId === mid).reduce((s, m) => s + (+m.custo || 0), 0); }
        function qtdManutencaoMotorista(mid) { return manutencoes.filter(m => m.driverId === mid).length; }
        function custosMotorista(mid, viagensLista = viagens, abastecimentosLista = abastecimentos, manutencoesLista = manutencoes) {
            const vm = viagensLista.filter(v => String(v.driverId) === String(mid));
            const am = abastecimentosLista.filter(a => String(a.driverId) === String(mid));
            const mm = manutencoesLista.filter(m => String(m.driverId) === String(mid));
            const km = vm.reduce((s,v) => s + Math.max(0, (Number(v.kmFinal)||0) - (Number(v.kmInicial)||0)), 0);
            const combustivel = am.reduce((s,a) => s + (Number(a.valor)||0), 0);
            const pedagio = am.reduce((s,a) => s + (Number(a.pedagio)||0), 0);
            const extras = am.reduce((s,a) => s + (Number(a.despesaExtra)||0), 0);
            const manutencao = mm.reduce((s,m) => s + (Number(m.custo)||0), 0);
            const total = combustivel + pedagio + extras + manutencao;
            return { km, combustivel, pedagio, extras, manutencao, total, custoPorKm: km > 0 ? total/km : 0 };
        }
        function rankingCustosMotoristas(viagensLista, abastecimentosLista, manutencoesLista) {
            return motoristas.map(m => {
                const c = custosMotorista(m.id, viagensLista, abastecimentosLista, manutencoesLista);
                return { id:m.id, nome:m.nome, foto:m.foto||'', ...c, viagens:viagensLista.filter(v=>String(v.driverId)===String(m.id)).length };
            }).filter(m => m.km > 0 || m.total > 0).sort((a,b) => a.custoPorKm - b.custoPorKm);
        }
        function rankingManutencaoMotoristas() {
            return motoristas.map(m => ({ id: m.id, nome: m.nome, foto: m.foto, custo: custoManutencaoMotorista(m.id), qtd: qtdManutencaoMotorista(m.id) }))
                .filter(x => x.custo > 0).sort((a, b) => b.custo - a.custo);
        }
        function rankingManutencaoPorKmMotoristas(viagensLista, manutencoesLista) {
    const ranking = motoristas.map(m => {
        const viagensMotorista = viagensLista.filter(
            v => String(v.driverId) === String(m.id)
        );
        const km = viagensMotorista.reduce((total, v) => {
            const kmInicial = Number(v.kmInicial) || 0;
            const kmFinal = Number(v.kmFinal) || 0;
            return total + Math.max(0, kmFinal - kmInicial);
        }, 0);
        const manutencoesMotorista = manutencoesLista.filter(
            mt => String(mt.driverId) === String(m.id)
        );
        const custo = manutencoesMotorista.reduce(
            (total, mt) => total + (Number(mt.custo) || 0),
            0
        );
        const qtd = manutencoesMotorista.length;
        const custoPorKm = km > 0 ? custo / km : null;
        return {
            id: m.id,
            nome: m.nome,
            foto: m.foto || '',
            km,
            custo,
            qtd,
            custoPorKm
        };
    })
    .filter(m => m.km > 0)
    .sort((a, b) => a.custoPorKm - b.custoPorKm);
    return ranking;
}

        function proximoId(prefixo, lista) {
            let max = 0;
            lista.forEach(item => {
                const num = parseInt(String(item.id || '').replace(prefixo, ''), 10);
                if (!isNaN(num) && num > max) max = num;
            });
            return prefixo + String(max + 1).padStart(2, '0');
        }

        function veiculoMotoristaVinculado() {
            if (!motoristaAtual || !motoristaAtual.vehicleId) return null;
            return veiculos.find(v => String(v.id) === String(motoristaAtual.vehicleId)) || null;
        }

        function motoristasVinculadosAoVeiculo(vehicleId) {
            return motoristas.filter(m =>
                String(m.id) !== String(motoristaAtual ? motoristaAtual.id : '') &&
                String(m.vehicleId || '') === String(vehicleId)
            );
        }

        function dadosManutencaoVeiculo(v) {
            if (!v) return { atual: 0, base: 0, intervalo: 0, limite: null, vencida: false, restante: null, ultima: null };

            const TIPOS_PREVENTIVA = ['Preventiva', 'Revisão preventiva', 'Revisão geral', 'Revisão'];
            const preventivas = manutencoes
                .filter(m => String(m.vehicleId) === String(v.id) && TIPOS_PREVENTIVA.includes(String(m.tipo || '').trim()))
                .slice()
                .sort((a, b) => (String(b.data || '') + ' ' + String(b.id || '')).localeCompare(String(a.data || '') + ' ' + String(a.id || '')));

            const ultima = preventivas[0] || null;
            const base = ultima && isFinite(+ultima.kmAtual) && +ultima.kmAtual > 0
                ? +ultima.kmAtual
                : (+v.hodometro || 0);
            const atual = odometroAtual(v.id);
            const intervalo = +v.intervaloManutencao || 0;
            const limite = intervalo > 0 ? base + intervalo : null;
            const vencida = limite != null && atual >= limite;
            const restante = limite != null ? limite - atual : null;

            return { atual, base, intervalo, limite, vencida, restante, ultima };
        }
        function proximaManutencaoVeiculo(v) { return dadosManutencaoVeiculo(v).limite; }
        function resumoManutencaoMotorista(v) {
            const d = dadosManutencaoVeiculo(v);
            if (d.limite == null) return { texto: 'Não informado', classe: '', detalhe: '' };
            if (d.vencida) {
                return {
                    texto: 'VENCIDA',
                    classe: 'motorista-status-vencida',
                    detalhe: `Deveria ter sido feita em ${fmtInt(d.limite)} km · ${fmtInt(Math.max(0, d.atual - d.limite))} km acima do limite`
                };
            }
            return {
                texto: `${fmtInt(d.limite)} km`,
                classe: 'motorista-status-ok',
                detalhe: `${fmtInt(Math.max(0, d.restante))} km restantes`
            };
        }

        async function selecionarVeiculoMotorista(vehicleId) {
            const v = veiculos.find(x => String(x.id) === String(vehicleId));
            if (!v) {
                toast('⚠️ Selecione um veículo');
                return;
            }

            if (String(v.status || 'Ativo').trim() === 'Manutenção') {
                toast('⚠️ Este veículo está em manutenção e não pode ser utilizado.');
                return;
            }

            if (!motoristaAtual || !motoristaAtual.id) {
                toast('❌ Motorista não identificado');
                return;
            }

            const outros = motoristasVinculadosAoVeiculo(vehicleId);
            if (outros.length) {
                const nomes = outros.map(m => m.nome).join(', ');
                const ok = confirm(
                    `⚠️ ATENÇÃO\n\n` +
                    `Este veículo está vinculado como referência a: ${nomes}.\n\n` +
                    `Você pode utilizar este veículo mesmo assim.\n` +
                    `O vínculo do outro motorista NÃO será alterado.\n\n` +
                    `Deseja registrar ${v.placa} como seu veículo de referência?`
                );
                if (!ok) return;
            }

            const btn = document.getElementById('btnConfirmarVeiculoMotorista');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ Salvando vínculo...';
            }

            const atualizado = { ...motoristaAtual, vehicleId: String(v.id) };
            const ok = await apiPost('MOTORISTAS', atualizado, 'atualizar');

            if (!ok) {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '✅ Confirmar e salvar vínculo';
                }
                toast('❌ Não foi possível registrar o vínculo na planilha');
                return;

async function confirmarAlteracaoSenha() {

    const senhaAtual = document
        .getElementById('senhaAtualAdmin')
        .value
        .trim();

    const novaSenha = document
        .getElementById('novaSenhaAdmin')
        .value
        .trim();

    const confirmarSenha = document
        .getElementById('confirmarSenhaAdmin')
        .value
        .trim();


    // =====================================================
    // VALIDAÇÕES
    // =====================================================

    if (!senhaAtual) {

        toast('⚠️ Digite a senha atual');

        document
            .getElementById('senhaAtualAdmin')
            .focus();

        return;
    }


    if (!novaSenha) {

        toast('⚠️ Digite a nova senha');

        document
            .getElementById('novaSenhaAdmin')
            .focus();

        return;
    }


    if (novaSenha.length < 4) {

        toast('⚠️ A nova senha deve ter pelo menos 4 caracteres');

        document
            .getElementById('novaSenhaAdmin')
            .focus();

        return;
    }


    if (!confirmarSenha) {

        toast('⚠️ Confirme a nova senha');

        document
            .getElementById('confirmarSenhaAdmin')
            .focus();

        return;
    }


    if (novaSenha !== confirmarSenha) {

        toast('⚠️ As novas senhas não conferem');

        document
            .getElementById('confirmarSenhaAdmin')
            .focus();

        return;
    }


    if (senhaAtual === novaSenha) {

        toast('⚠️ A nova senha deve ser diferente da atual');

        return;
    }


    // =====================================================
    // BOTÃO
    // =====================================================

    const btn = document.getElementById('btnAlterarSenha');

    if (btn) {

        btn.disabled = true;
        btn.textContent = 'Alterando...';

    }


    try {

        const resposta = await apiPost(
            'ADMIN',
            {
                senhaAtual: senhaAtual,
                novaSenha: novaSenha
            },
            'alterarSenha'
        );


        // =================================================
        // SUCESSO
        // =================================================

        if (resposta === true) {

            fecharModal();

            toast('✅ Senha alterada com sucesso');

            return;
        }


        // =================================================
        // ERRO
        // =================================================

        toast(
            '❌ Não foi possível alterar a senha'
        );

    } catch (erro) {

        console.error(
            'Erro ao alterar senha administrativa:',
            erro
        );

        toast(
            '❌ Erro ao alterar a senha'
        );

    }


    if (btn) {

        btn.disabled = false;
        btn.textContent = '🔐 Alterar senha';

    }
}

        async function previsualizarFoto(inputId, previewId, campoId) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            if (!input || !input.files || !input.files[0]) return;
            const file = input.files[0];
            if (!file.type.startsWith('image/')) { toast('⚠️ Selecione uma imagem'); return; }
            const reader = new FileReader();
            reader.onload = async e => {
                const base64 = e.target.result;
                preview.src = base64;
                preview.style.display = 'block';
                toast('📤 Enviando foto ao Drive...');
                // Guarda a Promise para o salvarVeiculo aguardar
                uploadEmAndamento = (async () => {
                    try {
                        const r = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({ tabela: 'FOTO', acao: 'uploadFoto', base64: base64, nomeArquivo: file.name })
                        });
                        const j = await r.json();
                        if (j && j.ok && j.url) {
                            document.getElementById(campoId).value = j.url;
                            toast('📸 Foto enviada ao Drive!');
                        } else {
                            toast('❌ ' + (j && j.erro || 'resposta inválida'));
                            console.error('ERRO UPLOAD:', j);
                        }
                    } catch (err) {
                        toast('❌ Falha de rede: ' + err.message);
                        console.error('ERRO REDE:', err);
                    }
                })();
                await uploadEmAndamento;
            };
            reader.readAsDataURL(file);
        }

        async function salvarVeiculo(id) {
            if (salvando) return;
            salvando = true;
            const btn = document.querySelector('#modal .btn.green');
            if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
            try {
                if (uploadEmAndamento) { await uploadEmAndamento; uploadEmAndamento = null; }

                const placa = document.getElementById('mPlaca').value.toUpperCase().trim();
                const modelo = document.getElementById('mModelo').value.trim();
                const marca = document.getElementById('mMarca').value.trim();
                const ano = document.getElementById('mAno').value.trim();
                const hodometro = document.getElementById('mHodometro').value.trim();
                const kmAtual = document.getElementById('mKmAtual').value.trim();
                const intervalo = document.getElementById('mIntervalo').value.trim();

                // VALIDAÇÃO: TODOS os campos obrigatórios
                if (!placa) { toast('⚠️ Informe a placa'); return; }
                if (!modelo) { toast('⚠️ Informe o modelo'); return; }
                if (!marca) { toast('⚠️ Informe a marca'); return; }
                if (!ano) { toast('⚠️ Informe o ano'); return; }
                if (!hodometro) { toast('⚠️ Informe o hodômetro (km inicial)'); return; }
                if (!kmAtual) { toast('⚠️ Informe o km atual'); return; }
                if (!intervalo) { toast('⚠️ Informe o intervalo de manutenção'); return; }

                // VALIDAÇÃO DE DUPLICIDADE (só para veículo novo)
                if (!id) {
                    const duplicado = veiculos.find(v => v.placa && String(v.placa).toUpperCase().trim() === placa);
                    if (duplicado) {
                        toast('⚠️ Esta placa já está cadastrada!');
                        return;
                    }
                }

                const d = {
                    id: id || proximoId('v', veiculos),
                    placa, modelo, marca, ano,
                    tipo: document.getElementById('mTipo').value,
                    status: document.getElementById('mStatus').value,
                    intervaloManutencao: +intervalo,
                    foto: document.getElementById('mFoto').value,
                    hodometro: +hodometro,
                    kmAtual: +kmAtual
                };

                const acao = id ? 'atualizar' : 'salvar';
                if (id) { const v = veiculos.find(x => x.id === id); if (v) Object.assign(v, d); }
                else { veiculos.push(d); }

                await salvarRemoto('VEICULOS', d, acao);
                fecharModal(); render(); toast('✅ Veículo salvo!');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = 'Salvar'; }
                salvando = false;
            }
        }

        async function excluir(tipo, id) {
            if (!confirm('Excluir este registro?')) return;

            // Verifica se existe histórico vinculado (só para veículo)
            let historico = [];
            if (tipo === 'veiculo') {
                historico = [
                    ...viagens.filter(v => v.vehicleId === id),
                    ...abastecimentos.filter(a => a.vehicleId === id),
                    ...manutencoes.filter(m => m.vehicleId === id)
                ];
            }

            // Veículo com histórico: pergunta se quer excluir tudo
            if (tipo === 'veiculo' && historico.length) {
                const qtd = historico.length;
                const confirmar = confirm(
                    `Este veículo possui ${qtd} registro(s) de histórico (viagens, abastecimentos e/ou manutenções).\n\n` +
                    `Deseja excluir TUDO (o veículo e todo o histórico vinculado)?\n` +
                    `• OK = excluir veículo + histórico\n` +
                    `• Cancelar = manter (pode marcar como Inativo)`
                );
                if (!confirmar) {
                    toast('ℹ️ Veículo mantido. Você pode marcá-lo como Inativo.');
                    return;
                }
            }

            if (tipo === 'veiculo') {
                // Exclui o veículo E todo o histórico vinculado
                const viagensV = viagens.filter(v => v.vehicleId === id);
                const abastV = abastecimentos.filter(a => a.vehicleId === id);
                const manutV = manutencoes.filter(m => m.vehicleId === id);

                viagens = viagens.filter(v => v.vehicleId !== id);
                abastecimentos = abastecimentos.filter(a => a.vehicleId !== id);
                manutencoes = manutencoes.filter(m => m.vehicleId !== id);
                veiculos = veiculos.filter(v => v.id !== id);

                await apiPost('VEICULOS', { id: id }, 'deletar');
                for (const v of viagensV) { await apiPost('VIAGENS', { id: v.id }, 'deletar'); }
                for (const a of abastV) { await apiPost('ABASTECIMENTOS', { id: a.id }, 'deletar'); }
                for (const m of manutV) { await apiPost('MANUTENCOES', { id: m.id }, 'deletar'); }
                toast('🗑️ Veículo e histórico excluídos');
            }
            else if (tipo === 'motorista') {
                // Exclui SOMENTE o motorista da base de motoristas (mantém viagens e manutenções)
                motoristas = motoristas.filter(m => m.id !== id);
                await apiPost('MOTORISTAS', { id: id }, 'deletar');
                toast('🗑️ Motorista excluído');
            }

            salvar(); render();
        }

        /* ===== FILTRO DE PERÍODO DO DASHBOARD ===== */
        function obterPeriodosDashboard() {
            const periodos = new Set();
            [...viagens, ...abastecimentos, ...manutencoes].forEach(item => {
                const data = String(item.data || '');
                if (/^\d{4}-\d{2}/.test(data)) {
                    periodos.add(data.slice(0, 7));
                }
            });
            return [...periodos].sort().reverse();
        }

        function nomePeriodoDashboard(periodo) {
            if (!periodo) return 'Todo o período';
            const [ano, mes] = periodo.split('-');
            const meses = [
                'Janeiro', 'Fevereiro', 'Março', 'Abril',
                'Maio', 'Junho', 'Julho', 'Agosto',
                'Setembro', 'Outubro', 'Novembro', 'Dezembro'
            ];
            return `${meses[Number(mes) - 1]}/${ano}`;
        }

        function filtrarPorPeriodo(lista, periodo) {
            if (!periodo) return lista;
            return lista.filter(item =>
                String(item.data || '').slice(0, 7) === periodo
            );
        }

        /* ===== BOTÃO X PARA FECHAR (USA A FUNÇÃO DO PRÓPRIO SISTEMA) ===== */
        function colocarX(el) {
            if (!el || el.querySelector('.btnFecharX')) return;
            var x = document.createElement('span');
            x.className = 'btnFecharX';
            x.innerHTML = '✕';
            x.setAttribute('style', 'position:absolute;top:10px;right:14px;font-size:24px;font-weight:bold;cursor:pointer;color:#666;z-index:9999;line-height:1;');
            x.onclick = function (e) {
                e.stopPropagation();
                // Chama o fechamento do próprio sistema (restaura tudo corretamente)
                if (typeof fecharModal === 'function') fecharModal();
                else if (typeof fecharModalVeiculo === 'function') fecharModalVeiculo();
                else if (typeof fecharModalMotorista === 'function') fecharModalMotorista();
                else {
                    document.querySelectorAll('.modal, .modal-content, .overlay, .modal-overlay').forEach(function (m) {
                        m.style.display = 'none';
                    });
                }
            };
            el.style.position = 'relative';
            el.appendChild(x);
        }

        setInterval(function () {
            document.querySelectorAll('.modal, .modal-content, .overlay, .modal-overlay, [id^="modal"], [id*="odal"]').forEach(function (m) {
                if (m.offsetParent !== null) colocarX(m);
            });
